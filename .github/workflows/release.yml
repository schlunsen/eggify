name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, os: linux, arch: amd64, triple: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-22.04-arm, os: linux, arch: arm64, triple: aarch64-unknown-linux-gnu}
          - {runner: macos-15-intel, os: darwin, arch: amd64, triple: x86_64-apple-darwin}
          - {runner: macos-14, os: darwin, arch: arm64, triple: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: internal/server/frontend
        run: |
          npm ci
          npm run generate
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Linux packaging tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Build and package
        env:
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TRIPLE: ${{ matrix.triple }}
          CGO_ENABLED: '1'
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eggify-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum eggify-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Eggify ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
