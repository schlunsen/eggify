[package]
name = "eggify-license"
version = "0.1.0"
edition = "2021"
description = "Eggify license server: issues signed licenses for serial numbers (see docs/licensing-protocol.md)"
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "eggify-license"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
hex = "0.4"
http-body-util = "0.1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
